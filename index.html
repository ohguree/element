<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>원소기호 짝 맞추기 (1인용·2인용)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#F5F7FF; --ink:#2F3A5A; --line:#D9DFF5;
  --mint:#C6F0E2; --mint-d:#6FCBB0;
  --peach:#FFE9B8; --peach-d:#F2C15E;
  --sky:#CFE3FF; --sky-d:#7FA9EE;
  --lemon:#E6DEFF; --lemon-d:#9C8AE0;
  --pink:#B9B2F2;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Jua','Malgun Gothic','Apple SD Gothic Neo',sans-serif;
  min-height:100vh;display:flex;justify-content:center;
  }
main{width:100%;max-width:880px;padding:20px 16px 40px}
h1{font-size:clamp(30px,6vw,46px);margin:8px 0 4px;text-align:center}
.sub{text-align:center;font-size:clamp(18px,3vw,22px);margin:0 0 20px}
.panel{background:#fff;border:4px solid var(--line);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);margin-bottom:20px}
.hidden{display:none!important}
button{font-family:inherit;color:var(--ink);cursor:pointer}
.level-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px}
.level{border:4px solid;border-radius:24px;padding:16px 10px;font-size:clamp(22px,4vw,28px);line-height:1.3;box-shadow:0 5px 0 rgba(0,0,0,.12);transition:transform .1s}
.level small{display:block;font-size:clamp(16px,2.6vw,19px);opacity:.85;margin-top:4px}
.level:hover{transform:translateY(-3px)}
.level:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.l-easy{background:var(--mint);border-color:var(--mint-d)}
.l-mid{background:var(--lemon);border-color:var(--lemon-d)}
.l-hard{background:var(--peach);border-color:var(--peach-d)}
.hud{display:flex;gap:10px;justify-content:space-between;align-items:stretch;flex-wrap:wrap;margin-bottom:14px}
.chip{flex:1 1 90px;background:#fff;border:4px solid var(--line);border-radius:20px;text-align:center;padding:6px 8px;font-size:clamp(18px,3vw,24px)}
.chip b{display:block;font-size:clamp(24px,4.5vw,34px);font-weight:400}
.btn{background:var(--sky);border:4px solid var(--sky-d);border-radius:20px;padding:8px 18px;font-size:clamp(18px,3vw,22px);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.btn.sec{background:#fff;border-color:var(--line)}
.board{display:grid;margin:0 auto;justify-content:center}
.card{perspective:700px;border:0;background:none;padding:0;aspect-ratio:1/1;width:100%}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .35s}
.card.open .inner,.card.done .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;border-radius:20px;border:4px solid;
  display:flex;align-items:center;justify-content:center;text-align:center;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.back{background:linear-gradient(145deg,#C9C3F7,#A9B8F5);border-color:#8E9BE6;color:#fff}
.back svg{width:56%;height:auto}
.logo{display:block;width:56px;height:56px;margin:0 auto;color:#7C6FE0}
.tile{position:absolute;top:4px;left:8px;font-size:calc(var(--cs,100px)*.14);opacity:.75;line-height:1}
.front{transform:rotateY(180deg);font-size:calc(var(--cs,100px)*.25);flex-direction:column;line-height:1.1}
.front.long{font-size:calc(var(--cs,100px)*.19)}
.front.name,.front.sym{background:var(--sky);border-color:var(--sky-d)}
.front.sym{font-size:calc(var(--cs,100px)*.42)}
.card.done .front{background:var(--mint);border-color:var(--mint-d)}
.card.wrong .front{animation:shake .4s}
@keyframes shake{25%{transform:rotateY(180deg) translateX(-6px)}75%{transform:rotateY(180deg) translateX(6px)}}
.big{font-size:clamp(46px,10vw,72px);text-align:center;margin:0}
.result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:14px 0}
table{width:100%;border-collapse:collapse;font-size:clamp(17px,2.8vw,21px)}
th,td{padding:6px 4px;text-align:center;border-bottom:2px dashed var(--line)}
h2{margin:0 0 10px;font-size:clamp(24px,4vw,30px)}
.tabs{display:flex;gap:8px;margin-bottom:10px;flex-wrap:wrap}
.tab{border:3px solid var(--line);background:#fff;border-radius:16px;padding:4px 14px;font-size:clamp(17px,2.8vw,20px)}
.tab.on{background:var(--lemon);border-color:var(--lemon-d)}
.center{text-align:center}
body[data-screen=game] #head,body[data-screen=result] #head,body[data-screen=result2] #head{display:none}
body[data-screen=game] main,body[data-screen=result] main,body[data-screen=result2] main{padding-top:10px;padding-bottom:10px}
body[data-screen=game] .hud{margin-bottom:8px;gap:8px}
body[data-screen=game] .chip{padding:2px 8px;font-size:15px;border-width:3px;border-radius:16px}
body[data-screen=game] .chip b{font-size:22px}
body[data-screen=game] .btn{padding:6px 14px;font-size:18px}
@media (max-width:960px){#game .hud{padding-right:64px}}
#result:not(.hidden){display:grid;gap:16px;align-items:start}
@media (min-width:760px){#result:not(.hidden){grid-template-columns:1fr 1fr}}
#result .panel{margin-bottom:0}
.result-grid .chip{font-size:clamp(14px,2.2vw,18px);white-space:nowrap;padding:6px 2px}
.result-grid .chip b{font-size:clamp(22px,3.4vw,30px)}
/* 메인(모드 선택) */
.mode-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.mode{border:4px solid;border-radius:28px;padding:28px 12px;font-size:clamp(30px,6vw,42px);line-height:1.25;box-shadow:0 6px 0 rgba(0,0,0,.12);transition:transform .1s}
.mode small{display:block;font-size:clamp(16px,2.8vw,20px);margin-top:8px;opacity:.85}
.mode:hover{transform:translateY(-3px)} .mode:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.12)}
.m1{background:var(--sky);border-color:var(--sky-d)}
.m2{background:var(--peach);border-color:var(--peach-d)}
.mode .ic{display:block;margin:0 auto 6px;width:72px;height:44px}
.back-row{margin-bottom:12px}
/* 2인용 */
.chip.p1{border-color:var(--mint-d)} .chip.p2{border-color:var(--peach-d)}
.chip small{font-size:.72em;opacity:.8}
.chip.active{transform:scale(1.05);box-shadow:0 0 0 5px rgba(124,111,224,.28)}
.chip.p1.active{background:var(--mint)} .chip.p2.active{background:var(--peach)}
.chip.turn{flex:2 1 220px}
body[data-screen=game] .chip.turn{flex-direction:row;align-items:center;justify-content:center;gap:14px;font-size:clamp(18px,3.2vw,24px)}
.bar{display:none;flex:1;height:24px;min-width:90px;background:rgba(255,255,255,.75);border:3px solid rgba(47,58,90,.18);border-radius:999px;overflow:hidden}
.bar i{display:block;height:100%;width:100%;border-radius:999px;background:#6FCBB0}
.chip.turn .bar{display:block}
.chip.turn.tp1 .bar i{background:#4DB896}
.chip.turn.tp2 .bar i{background:#EDA93A}
.chip.memo.barmode .bar{display:block}
.chip.memo.barmode b,body[data-screen=game] .chip.memo.barmode b{display:none}
.chip.memo.barmode .bar i{background:#7C6FE0}
.chip.turn.urgent .bar i,.chip.memo.urgent .bar i{background:#E24A6B}
.chip.turn.tp1{background:var(--mint);border-color:var(--mint-d)}
.chip.turn.tp2{background:var(--peach);border-color:var(--peach-d)}
.chip.turn.urgent{background:#FFD9DF;border-color:#F27A93}
.chip.turn.urgent b{color:#D6335A}
.card.done.p1 .front{background:var(--mint);border-color:var(--mint-d)}
.card.done.p2 .front{background:var(--peach);border-color:var(--peach-d)}
#result2 .panel{max-width:560px;margin:24px auto}
.vs{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:14px 0}
.vs .chip{padding:10px 6px}
.vs .win{box-shadow:0 0 0 5px rgba(242,193,94,.55)}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:20}
.new{color:#E0567F}
.chip.memo{background:#FFF3C4;border-color:#F2C15E}
body[data-screen=game] .hud{min-height:72px}
body[data-screen=game] .chip{display:flex;flex-direction:column;justify-content:center}
body[data-screen=game] .chip.memo{flex-direction:row;align-items:center;justify-content:center;gap:16px;font-size:clamp(18px,3.2vw,24px)}
body[data-screen=game] .chip.memo b{font-size:clamp(40px,8vw,56px);line-height:1;min-width:2.2em;display:inline-block}
.chip.memo b.pulse{animation:pulse .5s ease-out}
.chip.memo.urgent{background:#FFD9DF;border-color:#F27A93}
.chip.memo.urgent b{color:#D6335A}
@keyframes pulse{0%{transform:scale(1.35)}100%{transform:scale(1)}}
.sound{position:fixed;top:12px;right:12px;z-index:10;width:56px;height:56px;border-radius:50%;background:var(--lemon);border:4px solid var(--lemon-d);font-size:26px;box-shadow:0 4px 0 rgba(0,0,0,.12);padding:0}
</style>
</head>
<body>
<button class="sound" id="sound" aria-label="소리 켜기/끄기">🔊</button>
<canvas id="fx"></canvas>
<main>
  <header id="head">
  <span class="logo"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><ellipse cx="32" cy="32" rx="27" ry="10"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="4.5" fill="currentColor" stroke="none"/></svg></span>
  <h1>원소기호 짝 맞추기</h1>
  <p class="sub">원소 이름 카드와 원소기호 카드를 짝지어 보세요!</p>
  </header>

  <!-- 메인: 1인용 / 2인용 -->
  <section id="menu">
    <div class="panel">
      <h2 class="center">몇 명이서 할까요?</h2>
      <div class="mode-row">
        <button class="mode m1" id="go1">
          <svg class="ic" viewBox="0 0 72 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><circle cx="36" cy="14" r="9"/><path d="M18 42c2-12 10-16 18-16s16 4 18 16"/></svg>
          1인용<small>난이도를 골라 기록에 도전</small></button>
        <button class="mode m2" id="go2">
          <svg class="ic" viewBox="0 0 72 44" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round"><circle cx="21" cy="14" r="8"/><path d="M6 42c1-10 7-14 15-14s14 4 15 14"/><circle cx="51" cy="14" r="8"/><path d="M36 42c1-10 7-14 15-14s14 4 15 14"/></svg>
          2인용<small>번갈아 하는 대결 · 보통 난이도</small></button>
      </div>
    </div>
  </section>

  <!-- 1인용: 난이도 선택 + 기록 -->
  <section id="start" class="hidden">
    <div class="back-row"><button class="btn sec" id="back">← 처음 화면</button></div>
    <div class="panel">
      <h2>난이도를 골라요</h2>
      <div class="level-row">
        <button class="level l-easy" data-level="easy">쉬움<small>6쌍 · 카드 12장</small></button>
        <button class="level l-mid" data-level="mid">보통<small>8쌍 · 카드 16장</small></button>
        <button class="level l-hard" data-level="hard">어려움<small>12쌍 · 카드 24장</small></button>
      </div>
    </div>
    <div class="panel">
      <h2>내 기록</h2>
      <div class="tabs" id="tabs-start"></div>
      <div id="records-start"></div>
      <div class="center" style="margin-top:10px"><button class="btn sec" id="clear">기록 지우기</button></div>
    </div>
  </section>

  <!-- 게임 화면 -->
  <section id="game" class="hidden">
    <div class="hud" id="hud">
      <div class="chip" id="c-time">시간<b id="t">0</b></div>
      <div class="chip memo hidden" id="memo" style="flex:3 1 270px">카드를 외워 보세요!<b id="memo-t">5초</b><div class="bar"><i id="memo-bar"></i></div></div>
      <div class="chip p1 hidden" id="c-p1">1P 선공 <small>맞힐 때마다 +100</small><b id="s1">0</b></div>
      <div class="chip turn tp1 hidden" id="c-turn"><span id="turn-who">1P 차례</span><div class="bar"><i id="turn-bar"></i></div></div>
      <div class="chip p2 hidden" id="c-p2">2P 후공 <small>맞힐 때마다 +150</small><b id="s2">0</b></div>
      <div class="chip" id="c-miss">실수<b id="m">0</b></div>
      <div class="chip" id="c-pair">맞힌 짝<b id="p">0</b></div>
      <button class="btn sec" id="quit">처음으로</button>
    </div>
    <div class="board" id="board"></div>
  </section>

  <!-- 2인용 결과 화면 -->
  <section id="result2" class="hidden">
    <div class="panel">
      <h2 class="center" id="r2-title">1P 승리!</h2>
      <div class="vs">
        <div class="chip p1" id="r2-c1">1P 선공<b id="r2-s1">0</b></div>
        <div class="chip p2" id="r2-c2">2P 후공<b id="r2-s2">0</b></div>
      </div>
      <p class="center" id="r2-detail"></p>
      <div class="center" style="margin-top:8px">
        <button class="btn" id="again2">다시 대결</button>
        <button class="btn sec" id="home2">처음 화면</button>
      </div>
    </div>
  </section>

  <!-- 결과 화면 -->
  <section id="result" class="hidden">
    <div class="panel">
      <span class="logo" style="width:84px;height:84px"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><ellipse cx="32" cy="32" rx="27" ry="10"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="4.5" fill="currentColor" stroke="none"/></svg></span>
      <h2 class="center" id="r-title">모두 맞혔어요!</h2>
      <div class="result-grid">
        <div class="chip">점수<b id="r-score">0</b></div>
        <div class="chip">걸린 시간<b id="r-time">0</b></div>
        <div class="chip">실수<b id="r-miss">0</b></div>
      </div>
      <p class="center new" id="r-new"></p>
      <div class="center" style="margin-top:8px">
        <button class="btn" id="again">같은 난이도로 다시</button>
        <button class="btn sec" id="home">처음으로</button>
      </div>
    </div>
    <div class="panel">
      <h2>이 난이도 기록 TOP 5</h2>
      <div id="records-result"></div>
    </div>
  </section>
</main>

<script>
// [번호, 이름, 기호]
const ELEMENTS = [
  [1,'수소','H'],[2,'헬륨','He'],[3,'리튬','Li'],[4,'베릴륨','Be'],[5,'붕소','B'],
  [6,'탄소','C'],[7,'질소','N'],[8,'산소','O'],[9,'플루오린','F'],[10,'네온','Ne'],
  [11,'나트륨','Na'],[12,'마그네슘','Mg'],[13,'알루미늄','Al'],[14,'규소','Si'],[15,'인','P'],
  [16,'황','S'],[17,'염소','Cl'],[18,'아르곤','Ar'],[19,'칼륨','K'],[20,'칼슘','Ca'],
  [26,'철','Fe'],[29,'구리','Cu'],[30,'아연','Zn'],[47,'은','Ag'],[79,'금','Au'],[80,'수은','Hg']
];
const LEVELS = {
  easy:{label:'쉬움',pairs:6,cols:4,preview:5},
  mid: {label:'보통',pairs:8,cols:4,preview:8},
  hard:{label:'어려움',pairs:12,cols:6,preview:12}
};
const KEY = 'element-memory-records-v1';
const $ = id => document.getElementById(id);

let sess=0;   // 판 번호: '처음으로'나 새 게임을 누르면 올라가고, 이전 판에서 예약된 동작은 모두 무시된다
let mode=1, S=[0,0], cur=1, turnLeft=0, turnTimer=null, TURN_SEC=10, FIRST_PTS=100, SECOND_PTS=150;
let level='easy', first=null, lock=false, matched=0, misses=0, seconds=0, timer=null, started=false;


/* ---------- 소리 (Web Audio로 직접 만든 소리, 파일 없음) ---------- */
const Sound = (() => {
  const MUTE_KEY='element-memory-mute-v1';
  let ctx=null, master=null, bgmGain=null, timer=null, step=0, nextTime=0, playing=false;
  let muted=false;
  try{ muted = localStorage.getItem(MUTE_KEY)==='1'; }catch(e){}
  const STEP=0.2;                                   // 한 박 길이(초)
  const MELODY=[72,76,79,76,74,79,81,79,72,76,79,81,79,76,74,72,
                76,79,81,79,74,72,74,76,72,74,76,79,76,74,72,null];
  const BASS=[48,48,43,43,45,45,43,43];             // 4박마다 하나
  const hz=m=>440*Math.pow(2,(m-69)/12);

  function ensure(){
    if(!ctx){
      const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return false;
      ctx=new AC(); master=ctx.createGain(); master.gain.value=muted?0:1; master.connect(ctx.destination);
      bgmGain=ctx.createGain(); bgmGain.gain.value=0.30; bgmGain.connect(master);
    }
    if(ctx.state==='suspended') ctx.resume();
    return true;
  }
  function tone(freq,t,dur,type,vol,dest){
    const o=ctx.createOscillator(), g=ctx.createGain();
    o.type=type; o.frequency.value=freq;
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(vol,t+0.02);
    g.gain.exponentialRampToValueAtTime(0.0001,t+dur);
    o.connect(g); g.connect(dest); o.start(t); o.stop(t+dur+0.05);
  }
  function schedule(){
    while(nextTime < ctx.currentTime+0.4){
      const m=MELODY[step%MELODY.length];
      if(m) tone(hz(m),nextTime,STEP*1.6,'triangle',0.9,bgmGain);
      if(step%4===0) tone(hz(BASS[(step/4)%BASS.length]),nextTime,STEP*3.5,'sine',0.8,bgmGain);
      step++; nextTime+=STEP;
    }
  }
  function pop(t){                                   // 펑! 소리 (짧은 잡음)
    const len=Math.floor(ctx.sampleRate*0.18), buf=ctx.createBuffer(1,len,ctx.sampleRate), d=buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);
    const src=ctx.createBufferSource(); src.buffer=buf;
    const f=ctx.createBiquadFilter(); f.type='lowpass'; f.frequency.value=1400;
    const g=ctx.createGain(); g.gain.value=0.6;
    src.connect(f); f.connect(g); g.connect(master); src.start(t);
  }
  return {
    startBgm(){
      if(!ensure()||playing) return;
      playing=true; step=0; nextTime=ctx.currentTime+0.1;
      schedule(); timer=setInterval(schedule,100);
    },
    stopBgm(){ playing=false; clearInterval(timer); },
    wrong(){                                         // 띠띠
      if(!ensure()) return;
      const t=ctx.currentTime;
      tone(300,t,0.14,'square',0.5,master);
      tone(300,t+0.2,0.14,'square',0.5,master);
    },
    toggle(){
      muted=!muted;
      try{ localStorage.setItem(MUTE_KEY,muted?'1':'0'); }catch(e){}
      if(ctx) master.gain.value=muted?0:1;
      return muted;
    },
    fanfare(){                                       // 게임 끝 팡파레 + 폭죽 터지는 소리
      if(!ensure()) return; const t=ctx.currentTime;
      [[523.25,0,.14],[659.25,.16,.14],[783.99,.32,.14],[1046.5,.48,.4]].forEach(([f,o,d])=>{
        tone(f,t+o,d,'square',0.3,master); tone(f/2,t+o,d,'triangle',0.35,master);
      });
      [523.25,659.25,783.99,1046.5].forEach(f=>tone(f,t+0.95,1.0,'sawtooth',0.13,master));
      tone(130.8,t+0.95,1.0,'triangle',0.4,master);
      [0.3,0.8,1.2,1.7,2.2].forEach(o=>pop(t+o));
    },
    tickTock(){                                      // 째각(높은 소리) 째각(낮은 소리)
      if(!ensure()) return; const t=ctx.currentTime;
      tone(1400,t,0.06,'square',0.35,master);
      tone(950,t+0.5,0.06,'square',0.35,master);
    },
    tick(){ if(!ensure()) return; tone(1100,ctx.currentTime,0.05,'square',0.3,master); },
    ping(){                                          // 소리 확인용
      if(!ensure()) return; const t=ctx.currentTime;
      tone(660,t,0.18,'sine',0.6,master); tone(880,t+0.15,0.22,'sine',0.6,master);
    },
    isMuted(){ return muted; },
    pause(){ if(ctx&&ctx.state==='running') ctx.suspend(); },
    resume(){ if(ctx&&playing) ctx.resume(); }
  };
})();


/* ---------- 폭죽 + 색종이 ---------- */
const FX = (() => {
  const cv=document.getElementById('fx'), c=cv.getContext('2d');
  const COLORS=['#FF6B8B','#FFC145','#5CC8FF','#8E7CFF','#4FD6A5','#FF9F5A'];
  let parts=[], raf=null, endAt=0, nextBurst=0;
  const rnd=(a,b)=>a+Math.random()*(b-a);
  function size(){ const d=window.devicePixelRatio||1; cv.width=innerWidth*d; cv.height=innerHeight*d; c.setTransform(d,0,0,d,0,0); }
  function burst(x,y){
    const col=COLORS[Math.floor(Math.random()*COLORS.length)], col2=COLORS[Math.floor(Math.random()*COLORS.length)], n=50;
    for(let i=0;i<n;i++){
      const a=Math.PI*2*i/n, sp=rnd(2,6);
      parts.push({k:'s',x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,life:1,decay:rnd(.012,.02),r:rnd(2,3.6),col:i%3?col:col2});
    }
  }
  function confetti(n){
    for(let i=0;i<n;i++) parts.push({k:'c',x:rnd(0,innerWidth),y:-12,vx:rnd(-1,1),vy:rnd(2,4),w:rnd(6,11),h:rnd(4,8),rot:rnd(0,6),vr:rnd(-.2,.2),life:1,decay:.0035,col:COLORS[Math.floor(Math.random()*COLORS.length)]});
  }
  function loop(t){
    c.clearRect(0,0,innerWidth,innerHeight);
    if(t<endAt && t>=nextBurst){ burst(rnd(innerWidth*.15,innerWidth*.85),rnd(innerHeight*.12,innerHeight*.5)); confetti(7); nextBurst=t+rnd(350,650); }
    parts=parts.filter(q=>q.life>0 && q.y<innerHeight+20);
    for(const q of parts){
      q.x+=q.vx; q.y+=q.vy; q.life-=q.decay;
      if(q.k==='s'){ q.vy+=.06; q.vx*=.985; q.vy*=.985; c.globalAlpha=Math.max(q.life,0); c.fillStyle=q.col; c.beginPath(); c.arc(q.x,q.y,q.r,0,6.3); c.fill(); }
      else { q.rot+=q.vr; c.globalAlpha=1; c.save(); c.translate(q.x,q.y); c.rotate(q.rot); c.fillStyle=q.col; c.fillRect(-q.w/2,-q.h/2,q.w,q.h); c.restore(); }
    }
    c.globalAlpha=1;
    if(t<endAt || parts.length) raf=requestAnimationFrame(loop); else stop();
  }
  function start(){ stop(); size(); endAt=performance.now()+4500; nextBurst=0; raf=requestAnimationFrame(loop); }
  function stop(){ if(raf) cancelAnimationFrame(raf); raf=null; parts=[]; c.clearRect(0,0,innerWidth,innerHeight); }
  window.addEventListener('resize',()=>{ if(raf) size(); });
  return {start,stop};
})();

/* ---------- 기록 (localStorage) ---------- */
function loadRecords(){
  try{ return JSON.parse(localStorage.getItem(KEY)) || {easy:[],mid:[],hard:[]}; }
  catch(e){ return {easy:[],mid:[],hard:[]}; }
}
function saveRecords(r){
  try{ localStorage.setItem(KEY, JSON.stringify(r)); }catch(e){}
}
function addRecord(lv, rec){
  const r = loadRecords();
  r[lv] = r[lv] || [];
  r[lv].push(rec);
  r[lv].sort((a,b)=>b.score-a.score);
  r[lv] = r[lv].slice(0,5);
  saveRecords(r);
  return r[lv].indexOf(rec) === 0;      // 1위 여부
}
function table(lv, highlight){
  const list = (loadRecords()[lv]) || [];
  if(!list.length) return '<p class="center">아직 기록이 없어요. 첫 기록에 도전!</p>';
  return '<table><tr><th>순위</th><th>점수</th><th>시간</th><th>실수</th><th>날짜</th></tr>' +
    list.map((x,i)=>`<tr${x===highlight?' style="background:#E6DEFF"':''}><td>${i+1}</td><td>${x.score}</td><td>${x.time}초</td><td>${x.miss}</td><td>${x.date}</td></tr>`).join('') + '</table>';
}
let tabLevel='easy';
function renderStartRecords(){
  $('tabs-start').innerHTML = Object.keys(LEVELS).map(k=>`<button class="tab${k===tabLevel?' on':''}" data-tab="${k}">${LEVELS[k].label}</button>`).join('');
  $('records-start').innerHTML = table(tabLevel);
}

/* ---------- 점수 ---------- */
// 점수 = 쌍×100 + 시간 보너스 − 실수×30 (0점 미만은 0점)
// 시간 보너스 = max(0, 쌍×10 − 걸린 초) × 5
function calcScore(pairs, sec, miss){
  const bonus = Math.max(0, pairs*10 - sec) * 5;
  return Math.max(0, pairs*100 + bonus - miss*30);
}

/* ---------- 게임 ---------- */
function shuffle(a){ a=a.slice(); for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a; }
function show(id){ ['menu','start','game','result','result2'].forEach(s=>$(s).classList.toggle('hidden',s!==id)); document.body.dataset.screen=id; }

// 카드가 한 화면에 다 들어오도록 크기와 줄 수를 계산
let curCfg=null;
function layout(){
  if(!curCfg || $('game').classList.contains('hidden')) return;
  const total=curCfg.pairs*2, main=document.querySelector('main'), st=getComputedStyle(main);
  const padX=parseFloat(st.paddingLeft)+parseFloat(st.paddingRight), padY=parseFloat(st.paddingTop)+parseFloat(st.paddingBottom);
  const hud=$('hud'), hudH=hud.offsetHeight+parseFloat(getComputedStyle(hud).marginBottom);
  const availW=main.clientWidth-padX, availH=innerHeight-padY-hudH-6;
  const gap=Math.max(6,Math.min(12,Math.round(innerWidth/90)));
  let best=null;
  for(let cols=3;cols<=8;cols++){
    if(total%cols) continue;
    const rows=total/cols;
    const cs=Math.floor(Math.min((availW-gap*(cols-1))/cols,(availH-gap*(rows-1))/rows));
    if(!best||cs>best.cs) best={cols,cs};
  }
  const cs=Math.max(best.cs,44), b=$('board');
  b.style.gridTemplateColumns=`repeat(${best.cols},${cs}px)`;
  b.style.gap=gap+'px'; b.style.setProperty('--cs',cs+'px');
}
window.addEventListener('resize',layout);

let previewTimer=null;
// 막대: 남은 시간만큼 천천히 줄어든다
function runBar(el,sec){ el.style.transition='none'; el.style.width='100%'; void el.offsetWidth; el.style.transition='width '+sec+'s linear'; el.style.width='0%'; }
function freezeBar(el){ const w=getComputedStyle(el).width; el.style.transition='none'; el.style.width=w; }
const CH1=['c-time','c-miss','c-pair'], CH2=['c-p1','c-turn','c-p2'];
function setMemo(on,sec){
  $('memo').classList.toggle('hidden',!on);
  const act=mode===2?CH2:CH1, oth=mode===2?CH1:CH2;
  oth.forEach(id=>$(id).classList.add('hidden'));
  act.forEach(id=>$(id).classList.toggle('hidden',on));
  $('memo').classList.remove('urgent');
  if(on) $('memo-t').textContent=sec+'초';
}
function startGame(lv,m){
  sess++; const mySess=sess;
  FX.stop(); clearInterval(previewTimer); clearInterval(turnTimer);
  mode=m||1; level=(mode===2?'mid':lv); const cfg=LEVELS[level]; $('memo').classList.toggle('barmode',mode===2); setMemo(false);
  S=[0,0]; cur=1; $('s1').textContent='0'; $('s2').textContent='0'; $('c-p1').classList.remove('active'); $('c-p2').classList.remove('active');
  clearInterval(timer); first=null; lock=false; matched=0; misses=0; seconds=0; started=false;
  $('t').textContent='0'; $('m').textContent='0'; $('p').textContent='0 / '+cfg.pairs;
  const pick = shuffle(ELEMENTS).slice(0,cfg.pairs);
  const cards = [];
  pick.forEach(e=>{
    cards.push({id:e[0],type:'name',text:e[1]});
    cards.push({id:e[0],type:'sym', text:e[2]});
  });
  const board=$('board');
  curCfg=cfg;
  board.innerHTML='';
  shuffle(cards).forEach(c=>{
    const b=document.createElement('button');
    b.className='card'; b.dataset.id=c.id; b.dataset.type=c.type;
    b.setAttribute('aria-label','카드');
    const num = c.type==='sym' ? `<span class="tile">${c.id}</span>` : '';
    b.innerHTML=`<div class="inner"><div class="face back"><svg viewBox="0 0 64 64" fill="none" stroke="currentColor" stroke-width="3" aria-hidden="true"><ellipse cx="32" cy="32" rx="27" ry="10"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(60 32 32)"/><ellipse cx="32" cy="32" rx="27" ry="10" transform="rotate(120 32 32)"/><circle cx="32" cy="32" r="4.5" fill="currentColor" stroke="none"/></svg></div><div class="face front ${c.type}${c.text.length>=4?' long':''}">${num}${c.text}</div></div>`;
    b.addEventListener('click',()=>flip(b));
    board.appendChild(b);
  });
  show('game'); layout();
  Sound.startBgm();
  // 시작 전 외우기 시간: 카드를 모두 앞면으로 보여 준 뒤 덮는다 (이 동안은 카드를 누를 수 없고, 시간 측정도 시작 전)
  lock=true;
  const all=[...board.children]; let left=cfg.preview;
  setMemo(true,left); Sound.tickTock(); if(mode===2) runBar($('memo-bar'),left);
  setTimeout(()=>all.forEach(c=>c.classList.add('open')),150);
  previewTimer=setInterval(()=>{
    left--;
    if(left>0){
      const mt=$('memo-t'); mt.textContent=left+'초';
      mt.classList.remove('pulse'); void mt.offsetWidth; mt.classList.add('pulse');
      $('memo').classList.toggle('urgent',left<=3);
      Sound.tickTock(); return;
    }
    clearInterval(previewTimer); all.forEach(c=>c.classList.remove('open')); setMemo(false);
    setTimeout(()=>{ if(mySess!==sess) return; lock=false; if(mode===2) beginTurn(1); },400);
  },1000);
}

function flip(card){
  if(lock || card.classList.contains('open') || card.classList.contains('done')) return;
  if(mode===1 && !started){ started=true; timer=setInterval(()=>{seconds++; $('t').textContent=seconds;},1000); }
  card.classList.add('open');
  if(!first){ first=card; return; }
  const a=first, b=card; first=null; lock=true; const mine=sess;
  if(mode===2){ clearInterval(turnTimer); freezeBar($('turn-bar')); }       // 판정하는 동안은 제한 시간이 멈춘다
  if(a.dataset.id===b.dataset.id && a.dataset.type!==b.dataset.type){
    setTimeout(()=>{
      if(mine!==sess) return;
      a.classList.replace('open','done'); b.classList.replace('open','done');
      if(mode===2){
        a.classList.add('p'+cur); b.classList.add('p'+cur);
        S[cur-1]+= cur===1 ? FIRST_PTS : SECOND_PTS; $('s'+cur).textContent=S[cur-1];
        matched++; lock=false;
        if(matched===LEVELS.mid.pairs) finishTwo(); else beginTurn(cur);    // 맞히면 같은 사람이 계속
        return;
      }
      matched++; $('p').textContent=matched+' / '+LEVELS[level].pairs; lock=false;
      if(matched===LEVELS[level].pairs) finish();
    },350);
  }else{
    misses++; $('m').textContent=misses; Sound.wrong();
    a.classList.add('wrong'); b.classList.add('wrong');
    setTimeout(()=>{
      if(mine!==sess) return;
      a.classList.remove('open','wrong'); b.classList.remove('open','wrong'); lock=false;
      if(mode===2) beginTurn(cur===1?2:1);          // 틀리면 상대 차례
    },900);
  }
}

/* ---------- 2인용: 차례와 제한 시간 ---------- */
function updateTurnUI(anim){
  $('turn-who').textContent=cur+'P 차례';
  $('c-p1').classList.toggle('active',cur===1); $('c-p2').classList.toggle('active',cur===2);
  const t=$('c-turn'); t.classList.toggle('tp1',cur===1); t.classList.toggle('tp2',cur===2); t.classList.toggle('urgent',turnLeft<=3);
}
function beginTurn(p){
  cur=p; turnLeft=TURN_SEC; clearInterval(turnTimer); updateTurnUI(true); runBar($('turn-bar'),TURN_SEC);
  turnTimer=setInterval(()=>{
    turnLeft--; updateTurnUI(true);
    if(turnLeft>0 && turnLeft<=3) Sound.tick();
    if(turnLeft<=0){ clearInterval(turnTimer); turnTimeout(); }
  },1000);
}
function turnTimeout(){                              // 시간 안에 못 누르면 상대 차례
  if(first){ first.classList.remove('open'); first=null; }
  Sound.wrong(); beginTurn(cur===1?2:1);
}
function finishTwo(){
  clearInterval(turnTimer); Sound.stopBgm();
  $('r2-s1').textContent=S[0]; $('r2-s2').textContent=S[1];
  const w = S[0]>S[1]?1 : S[1]>S[0]?2 : 0;
  $('r2-title').textContent = w? w+'P 승리!' : '무승부!';
  $('r2-c1').classList.toggle('win',w===1); $('r2-c2').classList.toggle('win',w===2);
  $('r2-detail').textContent = '카드를 '+(S[0]/FIRST_PTS)+'쌍(1P) 대 '+(S[1]/SECOND_PTS)+'쌍(2P) 맞혔어요.';
  show('result2'); FX.start(); if(w) Sound.fanfare();
}

function finish(){
  clearInterval(timer); Sound.stopBgm();
  const cfg=LEVELS[level];
  const score=calcScore(cfg.pairs,seconds,misses);
  const rec={score,time:seconds,miss:misses,date:new Date().toLocaleDateString('ko-KR',{month:'numeric',day:'numeric'})};
  const best=addRecord(level,rec);
  $('r-score').textContent=score; $('r-time').textContent=seconds+'초'; $('r-miss').textContent=misses;
  $('r-new').textContent = best ? '이 난이도 최고 기록이에요!' : '';
  $('records-result').innerHTML=table(level,rec);
  show('result');
  FX.start();
  if(best) Sound.fanfare();          // 팡파레는 기록을 새로 세웠을 때만
}

/* ---------- 이벤트 ---------- */
document.querySelectorAll('.level').forEach(b=>b.addEventListener('click',()=>startGame(b.dataset.level,1)));
$('go1').addEventListener('click',()=>{ renderStartRecords(); show('start'); });
$('go2').addEventListener('click',()=>startGame('mid',2));
$('back').addEventListener('click',()=>show('menu'));
$('again2').addEventListener('click',()=>startGame('mid',2));
$('home2').addEventListener('click',()=>{ FX.stop(); show('menu'); });
$('tabs-start').addEventListener('click',e=>{ const t=e.target.dataset.tab; if(t){tabLevel=t; renderStartRecords();} });
$('clear').addEventListener('click',()=>{ if(confirm('저장된 기록을 모두 지울까요?')){ saveRecords({easy:[],mid:[],hard:[]}); renderStartRecords(); } });
$('again').addEventListener('click',()=>startGame(level));
$('home').addEventListener('click',()=>{ FX.stop(); renderStartRecords(); show('start'); });
$('quit').addEventListener('click',()=>{ sess++; clearInterval(previewTimer); clearInterval(turnTimer); clearInterval(timer); Sound.stopBgm(); setMemo(false); if(mode===2) show('menu'); else { renderStartRecords(); show('start'); } });
$('sound').textContent = Sound.isMuted() ? '🔇' : '🔊';
$('sound').addEventListener('click',()=>{ const m = Sound.toggle(); $('sound').textContent = m ? '🔇' : '🔊'; if(!m) Sound.ping(); });
document.addEventListener('visibilitychange',()=>{ document.hidden ? Sound.pause() : Sound.resume(); });
renderStartRecords();
show('menu');
</script>
